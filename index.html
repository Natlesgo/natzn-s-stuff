<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natzn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000208;
    --panel: #ff0000;
    --panel-2: #000000;
    --text: #ffffff;
    --muted: #ffffff;
    --cyan: #ffffffe0;
    --magenta: #9dff00;
    --purple: #eeff00;
    --yellow: #f7ff2e;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 0%, #000000 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Chakra Petch', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 5;
  }

  .frame-wrap{
    position:relative;
    padding: 3px;
    border-radius: 26px;
    background: conic-gradient(from var(--angle,0deg), var(--cyan), var(--purple), var(--magenta), var(--cyan));
    animation: spin 6s linear infinite;
    box-shadow: 0 0 40px -8px rgba(0, 5, 15, 0.719), 0 0 90px -20px rgba(251, 255, 0, 0.466);
  }

  @property --angle{
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes spin{
    to{ --angle: 360deg; }
  }

  .card{
    position:relative;
    width: min(360px, 88vw);
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border-radius: 24px;
    padding: 36px 26px 28px;
    text-align:center;
    z-index: 2;
  }

  .avatar-wrap{
    position:relative;
    width: 108px;
    height: 108px;
    margin: 0 auto 18px;
  }

  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border: 2px solid rgb(0, 0, 0);
    box-shadow: 0 0 22px -2px rgb(2, 0, 0);
    background: #00000000;
  }

  .nick{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size: 1.5rem;
    letter-spacing: .03em;
    margin: 0 0 8px;
    color: #ffffff;
    text-shadow: 0 0 14px rgb(0, 0, 0);
  }

  .bio{
    margin: 0 0 24px;
    color: #ffffff;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .zap-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size: 0.9rem;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: #000000;
    background: var(--cyan);
    padding: 13px 22px;
    border-radius: 12px;
    width:100%;
    margin-bottom: 26px;
    transition: transform .12s ease, box-shadow .2s ease;
    box-shadow: 0 0 20px -4px var(--cyan);
  }

  .zap-btn:hover{ transform: translateY(-2px); }
  .zap-btn:active{ transform: translateY(0px) scale(0.98); }

  .divider{
    height:1px;
    background: linear-gradient(90deg, transparent, rgba(124,138,168,0.35), transparent);
    margin: 0 0 22px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color: var(--text);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight:500;
    transition: border-color .2s ease, background .2s ease, transform .12s ease;
  }

  .link-btn:hover{
    transform: translateX(3px);
    background: rgba(255,255,255,0.06);
  }

  .link-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .link-btn.discord:hover{ border-color: var(--purple); }
  .link-btn.youtube:hover{ border-color: var(--magenta); }
  .link-btn.github:hover{ border-color: var(--cyan); }
  .link-btn.instagram:hover{ border-color: var(--magenta); }

  .link-handle{ color: var(--muted); margin-left:auto; font-size:0.78rem; }

  @media (prefers-reduced-motion: reduce){
    .frame-wrap{ animation: none; }
  }
</style>
</head>
